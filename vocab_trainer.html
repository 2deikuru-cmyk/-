<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f13;
    color: #f0ede8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 28px;
    margin-top: 8px;
  }

  /* Set selector */
  .sets {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 480px;
  }
  .set-btn {
    flex: 1;
    min-width: 130px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2a2a35;
    background: #18181f;
    color: #999;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    line-height: 1.4;
  }
  .set-btn:hover { border-color: #444; color: #ddd; }
  .set-btn.active { border-color: #7c6fff; background: #1e1b33; color: #b8b0ff; }

  /* Phase label */
  .phase-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555;
    text-align: center;
    margin-bottom: 12px;
  }

  /* Progress */
  .progress-track {
    width: 100%;
    max-width: 480px;
    height: 2px;
    background: #1e1e28;
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #7c6fff;
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Card */
  .card {
    width: 100%;
    max-width: 480px;
    background: #18181f;
    border: 1px solid #2a2a35;
    border-radius: 18px;
    padding: 40px 28px;
    text-align: center;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .card-prompt {
    font-size: 22px;
    font-weight: 500;
    color: #f0ede8;
    line-height: 1.35;
  }
  .card-counter {
    font-size: 12px;
    color: #444;
  }

  /* Input */
  .input-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 14px;
  }
  input[type="text"] {
    flex: 1;
    background: #18181f;
    border: 1px solid #2a2a35;
    border-radius: 10px;
    color: #f0ede8;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input[type="text"]:focus { border-color: #7c6fff; }
  input[type="text"]:disabled { opacity: 0.5; }
  .check-btn {
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid #2a2a35;
    background: #18181f;
    color: #f0ede8;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .check-btn:hover { background: #222230; border-color: #444; }

  /* Feedback */
  .feedback {
    font-size: 15px;
    font-weight: 500;
    min-height: 22px;
    text-align: center;
  }
  .feedback.correct { color: #5cdb95; }
  .feedback.wrong { color: #ff6b6b; }
  .correct-answer {
    font-size: 14px;
    color: #666;
    text-align: center;
    min-height: 20px;
    margin-top: 4px;
  }

  /* Next btn */
  .next-btn {
    display: none;
    margin-top: 14px;
    padding: 12px 28px;
    border-radius: 10px;
    border: 1px solid #2a2a35;
    background: #1e1e28;
    color: #b8b0ff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .next-btn:hover { background: #25253a; }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 20px;
    font-size: 13px;
    color: #555;
  }
  .stats strong { color: #888; }

  /* End screen */
  .end-screen {
    display: none;
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 2rem 1rem;
  }
  .end-screen h3 { font-size: 22px; font-weight: 500; margin-bottom: 10px; }
  .end-screen p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.6; }
  .action-btn {
    padding: 13px 28px;
    border-radius: 10px;
    border: 1px solid #2a2a35;
    background: #1e1e28;
    color: #b8b0ff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: #25253a; }
</style>
</head>
<body>

<h1>Vocabulary Trainer</h1>

<div class="sets">
  <button class="set-btn active" onclick="selectSet(0)">🎭 Arts &amp;<br>Performance</button>
  <button class="set-btn" onclick="selectSet(1)">⚽ Sport</button>
  <button class="set-btn" onclick="selectSet(2)">❄️ Adjectives<br>(Snowball)</button>
</div>

<div style="width:100%;max-width:480px;">
  <div class="phase-label" id="phase-label">Раунд 1 — все слова</div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <div id="main">
    <div class="card">
      <div class="card-prompt" id="prompt">...</div>
      <div class="card-counter" id="counter"></div>
    </div>
    <div class="input-row">
      <input type="text" id="answer" placeholder="Английский перевод..." autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="check-btn" id="submit">Проверить</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correct-answer"></div>
    <div style="text-align:center;">
      <button class="next-btn" id="next-btn">Следующее →</button>
    </div>
    <div class="stats">
      <span>Верно: <strong id="s-correct">0</strong></span>
      <span>Ошибок: <strong id="s-wrong">0</strong></span>
    </div>
  </div>

  <div class="end-screen" id="end-screen">
    <h3 id="end-title"></h3>
    <p id="end-body"></p>
    <button class="action-btn" id="action-btn"></button>
  </div>
</div>

<script>
const SETS = [
  {
    name: "Arts & Performance",
    words: [
      { ru: "аудитория, зрители", en: ["an audience", "audience"] },
      { ru: "хор", en: ["a choir", "choir"] },
      { ru: "показ, демонстрация, витрина", en: ["a display", "display"] },
      { ru: "выставка", en: ["an exhibition", "exhibition"] },
      { ru: "галерея", en: ["a gallery", "gallery"] },
      { ru: "инструмент", en: ["an instrument", "instrument"] },
      { ru: "живой концерт", en: ["a live concert", "live concert"] },
      { ru: "музыкант", en: ["a musician", "musician"] },
      { ru: "оркестр", en: ["an orchestra", "orchestra"] },
      { ru: "выступать вживую", en: ["to perform live", "perform live"] },
      { ru: "представление, выступление", en: ["a performance", "performance"] },
      { ru: "студия звукозаписи", en: ["a recording studio", "recording studio"] },
      { ru: "репетиционный зал", en: ["a rehearsal room", "rehearsal room"] },
      { ru: "репетировать", en: ["to rehearse", "rehearse"] },
      { ru: "сцена (часть действия / эпизод)", en: ["a scene", "scene"] },
      { ru: "зритель (спортивный или уличный)", en: ["a spectator", "spectator"] },
      { ru: "сцена (подмостки)", en: ["a stage", "stage"] },
    ]
  },
  {
    name: "Sport",
    words: [
      { ru: "чемпион", en: ["champion", "a champion"] },
      { ru: "тренер", en: ["coach", "a coach"] },
      { ru: "финал", en: ["final", "a final"] },
      { ru: "лига", en: ["league", "a league"] },
      { ru: "зритель (спортивный / уличный)", en: ["spectator", "a spectator"] },
      { ru: "стадион", en: ["stadium", "a stadium"] },
      { ru: "болельщик, фанат", en: ["supporter", "a supporter"] },
      { ru: "ведущий игрок, звезда", en: ["top player", "a top player"] },
      { ru: "турнир", en: ["tournament", "a tournament"] },
      { ru: "трофей, кубок", en: ["trophy", "a trophy"] },
    ]
  },
  {
    name: "Adjectives (Snowball)",
    words: [
      { ru: "соревновательный, конкурентный", en: ["competitive"] },
      { ru: "огромный, массивный", en: ["massive"] },
      { ru: "недорогой, доступный по цене", en: ["inexpensive"] },
      { ru: "привлекательный, притягательный", en: ["attractive"] },
      { ru: "эффективный, действенный", en: ["effective"] },
      { ru: "решительный, твёрдый", en: ["decisive"] },
      { ru: "творческий, креативный", en: ["creative"] },
      { ru: "агрессивный", en: ["aggressive"] },
      { ru: "активный, деятельный", en: ["active"] },
      { ru: "впечатляющий, внушительный", en: ["impressive"] },
    ]
  }
];

let currentSetIdx = 0;
let queue = [], mistakes = [], phaseTotal = 0, phaseCorrect = 0, phaseWrong = 0;
let current = null, answered = false, phase = 1;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalize(s) { return s.trim().toLowerCase().replace(/^(a|an|to)\s+/, ''); }

function selectSet(idx) {
  currentSetIdx = idx;
  document.querySelectorAll('.set-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  startPhase(SETS[idx].words, 1);
}

function updateStats() {
  document.getElementById('s-correct').textContent = phaseCorrect;
  document.getElementById('s-wrong').textContent = phaseWrong;
}

function startPhase(words, phaseNum) {
  phase = phaseNum;
  queue = shuffle(words);
  mistakes = [];
  phaseTotal = words.length;
  phaseCorrect = 0; phaseWrong = 0;
  document.getElementById('phase-label').textContent =
    phaseNum === 1 ? 'Раунд 1 — все слова' : `Раунд ${phaseNum} — работа над ошибками`;
  updateStats();
  nextCard();
}

function nextCard() {
  if (queue.length === 0) { endPhase(); return; }
  current = queue.shift();
  answered = false;
  document.getElementById('prompt').textContent = current.ru;
  const done = phaseTotal - queue.length - 1;
  document.getElementById('counter').textContent = `${done + 1} / ${phaseTotal}`;
  document.getElementById('progress-fill').style.width = (done / phaseTotal * 100) + '%';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('correct-answer').textContent = '';
  const ans = document.getElementById('answer');
  ans.value = ''; ans.disabled = false;
  document.getElementById('next-btn').style.display = 'none';
  updateStats();
  ans.focus();
}

function check() {
  if (answered) return;
  const userRaw = document.getElementById('answer').value;
  if (!userRaw.trim()) return;
  const user = normalize(userRaw);
  const ok = current.en.map(normalize).some(a => user === a);
  answered = true;
  document.getElementById('answer').disabled = true;
  const fb = document.getElementById('feedback');
  if (ok) {
    phaseCorrect++;
    fb.textContent = '✓ Верно!'; fb.className = 'feedback correct';
    document.getElementById('correct-answer').textContent = '';
  } else {
    phaseWrong++;
    fb.textContent = '✗ Неверно.'; fb.className = 'feedback wrong';
    document.getElementById('correct-answer').textContent = 'Правильно: ' + current.en[0];
    mistakes.push(current);
  }
  updateStats();
  document.getElementById('progress-fill').style.width = ((phaseTotal - queue.length) / phaseTotal * 100) + '%';
  const nb = document.getElementById('next-btn');
  nb.style.display = 'inline-block';
  nb.textContent = queue.length === 0 ? 'Завершить раунд →' : 'Следующее →';
}

function endPhase() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('main').style.display = 'none';
  document.getElementById('end-screen').style.display = 'block';
  const btn = document.getElementById('action-btn');
  if (mistakes.length > 0) {
    document.getElementById('end-title').textContent = `Раунд ${phase} завершён`;
    document.getElementById('end-body').textContent =
      `Верно: ${phaseCorrect} / ${phaseTotal}. Ошибок: ${mistakes.length} — сейчас повторим их.`;
    btn.textContent = `Перейти к ошибкам (${mistakes.length}) →`;
    btn.onclick = () => {
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      startPhase([...mistakes], phase + 1);
    };
  } else {
    document.getElementById('end-title').textContent = phase === 1 ? '🎉 Без ошибок!' : '🎉 Все ошибки исправлены!';
    document.getElementById('end-body').textContent = `Верно: ${phaseCorrect} / ${phaseTotal}. Отлично!`;
    btn.textContent = 'Начать заново с нуля';
    btn.onclick = () => {
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      startPhase(SETS[currentSetIdx].words, 1);
    };
  }
}

document.getElementById('submit').addEventListener('click', check);
document.getElementById('answer').addEventListener('keydown', e => {
  if (e.key === 'Enter') answered ? nextCard() : check();
});
document.getElementById('next-btn').addEventListener('click', nextCard);

selectSet(0);
</script>
</body>
</html>
